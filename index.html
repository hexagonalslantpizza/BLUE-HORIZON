<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLUE HORIZON — Ocean Prototype</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b28}
body{font-family:Arial,sans-serif;color:#e8f0ed}canvas{display:block}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#020c137a;z-index:5;text-align:center}
#panel{max-width:430px;margin:20px;padding:24px 28px;background:#07141be0;border:1px solid #bedcdc33;border-radius:8px;box-shadow:0 12px 50px #0008}#controlsPanel{display:none}#menuButtons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}#controlsPanel p{margin:9px 0}
h1{margin:0 0 8px;letter-spacing:.16em;font-size:23px}
p{color:#c0d0ce;line-height:1.5;font-size:14px}
button{margin-top:10px;border:1px solid #b4c9c4;color:#071b20;background:#c3d3c9;padding:11px 22px;border-radius:4px;font-weight:bold;cursor:pointer}
#crosshair{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#f1f3df;box-shadow:0 0 3px #000;pointer-events:none;z-index:2}
#status{position:fixed;right:16px;top:14px;z-index:2;font-size:11px;letter-spacing:.12em;color:#d4e0d9;text-shadow:0 2px 4px #000;pointer-events:none}
#underwater{position:fixed;inset:0;z-index:1;pointer-events:none;display:none;background:linear-gradient(180deg,rgba(8,75,91,.22),rgba(2,28,49,.42));box-shadow:inset 0 0 100px rgba(0,25,42,.35)}
</style>
</head>
<body>
<div id="overlay"><div id="panel"><div id="mainMenu"><h1>BLUE HORIZON</h1><p>Ocean and driftwood prototype</p><div id="menuButtons"><button id="start">ENTER OCEAN</button><button id="showControls" type="button">CONTROLS</button></div></div><div id="controlsPanel"><h1>CONTROLS</h1><p><b>WASD</b> — Move / swim</p><p><b>Mouse</b> — Look around</p><p><b>SPACE</b> — Jump onto driftwood or rise while underwater</p><p><b>CTRL</b> — Dive underwater</p><p><b>ESC</b> — Release mouse / open menu</p><button id="backToMenu" type="button">BACK</button></div></div></div>
<div id="crosshair"></div><div id="status">FIELD TEST 002</div><div id="underwater" aria-hidden="true"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from "three";
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x78929a);
scene.fog=new THREE.Fog(0x78929a,35,190);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,500);
camera.rotation.order="YXZ";
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.45));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=false;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.9;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc5d9d8,0x263b3d,1.15));
const sun=new THREE.DirectionalLight(0xffe4bd,1.6);
sun.position.set(-35,55,20);sun.castShadow=false;scene.add(sun);
const oceanGeometry=new THREE.PlaneGeometry(420,420,140,140);
oceanGeometry.rotateX(-Math.PI/2);
const oceanMaterial=new THREE.MeshStandardMaterial({color:0x245967,roughness:.34,metalness:.05,side:THREE.DoubleSide});
const ocean=new THREE.Mesh(oceanGeometry,oceanMaterial);ocean.receiveShadow=true;scene.add(ocean);
const positions=oceanGeometry.attributes.position;
const basePositions=positions.array.slice();
const waveLayers=[
  {dx:1,dz:.22,amplitude:.34,length:19,speed:1.05,steepness:.48},
  {dx:.42,dz:1,amplitude:.22,length:11,speed:1.35,steepness:.38},
  {dx:-.78,dz:.62,amplitude:.105,length:5.5,speed:1.8,steepness:.28},
  {dx:.15,dz:-1,amplitude:.045,length:2.4,speed:2.5,steepness:.18}
].map(wave=>{
  const directionLength=Math.hypot(wave.dx,wave.dz);
  return {...wave,dx:wave.dx/directionLength,dz:wave.dz/directionLength,k:2*Math.PI/wave.length};
});
const waveResult={height:0,x:0,z:0};
function waveSample(x,z,t){
  let height=0,offsetX=0,offsetZ=0;
  for(let i=0;i<waveLayers.length;i++){
    const wave=waveLayers[i];
    const phase=wave.k*(wave.dx*x+wave.dz*z)-wave.speed*t;
    const a=wave.amplitude;
    height+=a*Math.sin(phase);
    const horizontal=wave.steepness*a*Math.cos(phase);
    offsetX+=wave.dx*horizontal;offsetZ+=wave.dz*horizontal;
  }
  waveResult.height=height;waveResult.x=offsetX;waveResult.z=offsetZ;
  return waveResult;
}
function waveHeight(x,z,t){return waveSample(x,z,t).height;}
function surfaceNormal(x,z,t){
const e=.12;
const dx=(waveHeight(x+e,z,t)-waveHeight(x-e,z,t))/(2*e);
const dz=(waveHeight(x,z+e,t)-waveHeight(x,z-e,t))/(2*e);
return new THREE.Vector3(-dx,1,-dz).normalize();
}
const wood=new THREE.Group();scene.add(wood);
const plank=new THREE.Mesh(new THREE.BoxGeometry(1.9,.22,1.65),new THREE.MeshStandardMaterial({color:0x72583d,roughness:.96}));
plank.castShadow=true;plank.receiveShadow=true;wood.add(plank);
const grainMaterial=new THREE.MeshStandardMaterial({color:0x4e3b2b,roughness:1});
for(let i=0;i<5;i++){const groove=new THREE.Mesh(new THREE.BoxGeometry(1.55,.012,.018),grainMaterial);groove.position.set(0,.116,-.58+i*.28);wood.add(groove);}
const knot=new THREE.Mesh(new THREE.CylinderGeometry(.075,.075,.012,12),new THREE.MeshStandardMaterial({color:0x3d3026,roughness:1}));
knot.position.set(-.42,.12,.18);wood.add(knot);
const player={
  local:new THREE.Vector3(),
  velocity:new THREE.Vector3(),
  swimPosition:new THREE.Vector3(),
  height:1.68,
  yaw:0,
  pitch:0,
  inWater:false,
  diving:false,
  boardGrounded:true,
  boardJumpVelocity:0,
  fallingIntoWater:false,
  waterJumping:false
};
let pointerLocked=false,fallen=false;
const overlay=document.getElementById("overlay");
const underwaterOverlay=document.getElementById("underwater");
document.getElementById("start").addEventListener("click",()=>renderer.domElement.requestPointerLock());
document.addEventListener("pointerlockchange",()=>{pointerLocked=document.pointerLockElement===renderer.domElement;overlay.style.display=pointerLocked?"none":"grid";});
document.addEventListener("mousemove",event=>{if(!pointerLocked)return;player.yaw-=event.movementX*.0022;player.pitch=THREE.MathUtils.clamp(player.pitch-event.movementY*.002,-1.45,1.45);});
const keys=new Set();
const mainMenu=document.getElementById("mainMenu"),controlsPanel=document.getElementById("controlsPanel");
document.getElementById("showControls").addEventListener("click",()=>{mainMenu.style.display="none";controlsPanel.style.display="block";});
document.getElementById("backToMenu").addEventListener("click",()=>{controlsPanel.style.display="none";mainMenu.style.display="block";});
document.addEventListener("keydown",e=>{
  if(e.code==="Space"||e.code==="ControlLeft"||e.code==="ControlRight")e.preventDefault();
  if(e.code==="Space"&&!e.repeat){
    if(!player.inWater&&player.boardGrounded){
      player.boardJumpVelocity=4.7;
      player.boardGrounded=false;
    }else if(player.inWater){
      const surface=waveHeight(player.swimPosition.x,player.swimPosition.z,elapsed);
      if(player.swimPosition.y>=surface-.2&&player.swimPosition.y<=surface+.9){
        player.velocity.y=7.2;
        player.waterJumping=true;
      }else{
        player.velocity.y=2.2;
      }
    }
  }
  keys.add(e.code);
});
document.addEventListener("keyup",e=>keys.delete(e.code));
window.addEventListener("blur",()=>keys.clear());
const clock=new THREE.Clock(),up=new THREE.Vector3(0,1,0),forward=new THREE.Vector3(),right=new THREE.Vector3(),move=new THREE.Vector3(),localMove=new THREE.Vector3(),inverseWoodQuaternion=new THREE.Quaternion(),boardRelative=new THREE.Vector3();
let elapsed=0;
let normalUpdateCounter=0;
function updateOcean(t){
  const positionArray=positions.array;
  for(let i=0;i<positions.count;i++){
    const index=i*3,x=basePositions[index],z=basePositions[index+2];
    const sample=waveSample(x,z,t);
    positionArray[index]=x+sample.x;
    positionArray[index+1]=sample.height;
    positionArray[index+2]=z+sample.z;
  }
  positions.needsUpdate=true;
  // Wave positions update every frame; lighting normals update every third frame.
  if(++normalUpdateCounter%3===0)oceanGeometry.computeVertexNormals();
}
function updateDriftwood(t){
  const driftX=Math.sin(t*.11)*2.4+Math.sin(t*.047)*1.1;
  const driftZ=Math.cos(t*.09)*1.9+Math.sin(t*.061)*.8;
  const boardWave=waveSample(driftX,driftZ,t);
  wood.position.set(driftX+boardWave.x,boardWave.height+.12,driftZ+boardWave.z);
  wood.quaternion.setFromUnitVectors(up,surfaceNormal(driftX,driftZ,t));
  wood.rotateY(Math.sin(t*.22)*.025);
}
function updatePlayer(dt,t){
  forward.set(-Math.sin(player.yaw),0,-Math.cos(player.yaw)).normalize();
  right.set(Math.cos(player.yaw),0,-Math.sin(player.yaw)).normalize();
  move.set(0,0,0);
  if(keys.has("KeyW"))move.add(forward);
  if(keys.has("KeyS"))move.sub(forward);
  if(keys.has("KeyD"))move.add(right);
  if(keys.has("KeyA"))move.sub(right);
  if(move.lengthSq()>0)move.normalize();

  if(!player.inWater){
    localMove.copy(move).applyQuaternion(inverseWoodQuaternion.copy(wood.quaternion).invert());
    if(player.boardGrounded){
      player.local.x+=localMove.x*2.25*dt;
      player.local.z+=localMove.z*2.25*dt;
    }
    if(!player.boardGrounded){
      player.boardJumpVelocity-=9.8*dt;
      player.local.y+=player.boardJumpVelocity*dt;
      if(player.local.y<=0){
        player.local.y=0;player.boardJumpVelocity=0;player.boardGrounded=true;
      }
    }
    const edgeX=Math.abs(player.local.x)>1.03;
    const edgeZ=Math.abs(player.local.z)>.91;
    const boardPosition=new THREE.Vector3(player.local.x,player.local.y,player.local.z).applyQuaternion(wood.quaternion).add(wood.position);
    if(edgeX||edgeZ){
      const boardVelocity=new THREE.Vector3(move.x*1.1,player.boardJumpVelocity,move.z*1.1);
      player.inWater=true;fallen=true;player.fallingIntoWater=true;
      player.swimPosition.set(boardPosition.x,boardPosition.y+player.height,boardPosition.z);
      player.velocity.copy(boardVelocity);
      player.local.set(0,0,0);player.boardGrounded=true;player.boardJumpVelocity=0;
    }else{
      const cameraPosition=boardPosition.add(new THREE.Vector3(0,player.height,0));
      camera.position.copy(cameraPosition);
      camera.rotation.set(player.pitch,player.yaw,0,"YXZ");
      return;
    }
  }

  // Water movement has drag and neutral buoyancy. CTRL is a deliberate dive;
  // SPACE rises while held underwater and gives a single jump at the surface.
  const surface=waveHeight(player.swimPosition.x,player.swimPosition.z,t);
  const diving=keys.has("ControlLeft")||keys.has("ControlRight");
  const lookDirection=new THREE.Vector3(
    -Math.sin(player.yaw)*Math.cos(player.pitch),
    Math.sin(player.pitch),
    -Math.cos(player.yaw)*Math.cos(player.pitch)
  ).normalize();
  const swimInput=new THREE.Vector3();
  if(keys.has("KeyW"))swimInput.add(lookDirection);
  if(keys.has("KeyS"))swimInput.sub(lookDirection);
  if(keys.has("KeyD"))swimInput.add(right);
  if(keys.has("KeyA"))swimInput.sub(right);
  if(swimInput.lengthSq()>0)swimInput.normalize();

  const underwaterNow=player.swimPosition.y<surface-.12;
  const previousBoardLocalY=boardRelative.copy(player.swimPosition).sub(wood.position).applyQuaternion(inverseWoodQuaternion.copy(wood.quaternion).invert()).y;
  if(player.fallingIntoWater){
    player.velocity.y-=9.8*dt;
    player.swimPosition.addScaledVector(player.velocity,dt);
    const landingSurface=waveHeight(player.swimPosition.x,player.swimPosition.z,t);
    if(player.swimPosition.y<=landingSurface+.18){
      player.swimPosition.y=landingSurface+.18;
      player.velocity.y=0;player.fallingIntoWater=false;
    }else{
      camera.position.copy(player.swimPosition);
      camera.rotation.set(player.pitch,player.yaw,0,"YXZ");
      return;
    }
  }
  const swimAcceleration=underwaterNow?3.8:3.0;
  player.velocity.x+=swimInput.x*swimAcceleration*dt;
  player.velocity.z+=swimInput.z*swimAcceleration*dt;

  if(player.waterJumping){
    player.velocity.y-=9.8*dt;
  }else if(diving)player.velocity.y-=3.2*dt;
  else if(underwaterNow&&keys.has("Space")){
    player.velocity.y+=5.8*dt;
  }
  else if(!underwaterNow){
    const targetY=surface+.18;
    player.velocity.y+=(targetY-player.swimPosition.y)*2.8*dt;
  }else{
    // Hold depth when no vertical input is given; don't automatically float up.
    player.velocity.y*=Math.exp(-5.5*dt);
    if(Math.abs(player.velocity.y)<.035)player.velocity.y=0;
  }

  player.velocity.x*=Math.exp(-(underwaterNow?2.4:2.0)*dt);
  player.velocity.z*=Math.exp(-(underwaterNow?2.4:2.0)*dt);
  player.velocity.y*=Math.exp(-(player.waterJumping?.12:(diving?1.4:2.2))*dt);
  player.swimPosition.addScaledVector(player.velocity,dt);

  const newSurface=waveHeight(player.swimPosition.x,player.swimPosition.z,t);
  const boardLocal=boardRelative.copy(player.swimPosition).sub(wood.position).applyQuaternion(inverseWoodQuaternion.copy(wood.quaternion).invert());
  const boardTop=.11;
  const insideBoardTop=Math.abs(boardLocal.x)<.77&&Math.abs(boardLocal.z)<.64;
  if(player.waterJumping&&player.velocity.y<=0&&previousBoardLocalY>boardTop+player.height&&boardLocal.y<=boardTop+player.height&&insideBoardTop){
    player.inWater=false;player.waterJumping=false;player.fallingIntoWater=false;player.velocity.set(0,0,0);
    player.local.set(boardLocal.x,0,boardLocal.z);player.boardGrounded=true;player.pitch=0;
    underwaterOverlay.style.display="none";
    const landedPosition=new THREE.Vector3(player.local.x,player.height,player.local.z).applyQuaternion(wood.quaternion).add(wood.position);
    camera.position.copy(landedPosition);camera.rotation.set(player.pitch,player.yaw,0,"YXZ");
    return;
  }
  if(player.waterJumping&&player.swimPosition.y<=newSurface+.18&&player.velocity.y<=0){
    player.waterJumping=false;player.swimPosition.y=newSurface+.18;player.velocity.y=0;
  }
  // The plank blocks swimmers below its top; approaching players are pushed around its edges.
  if(!player.waterJumping){
    const bodyBottom=boardLocal.y-player.height;
    const verticalOverlap=bodyBottom<boardTop&&boardLocal.y>-.11;
    if(verticalOverlap&&Math.abs(boardLocal.x)<1.23&&Math.abs(boardLocal.z)<1.08){
      const pushX=1.23-Math.abs(boardLocal.x),pushZ=1.08-Math.abs(boardLocal.z);
      if(pushX<pushZ)boardLocal.x=Math.sign(boardLocal.x||1)*1.231;
      else boardLocal.z=Math.sign(boardLocal.z||1)*1.081;
      player.swimPosition.copy(boardLocal).applyQuaternion(wood.quaternion).add(wood.position);
      player.velocity.x*=.35;player.velocity.z*=.35;
    }
  }
  if(!diving&&!player.waterJumping&&player.swimPosition.y>newSurface+.9){
    player.swimPosition.y=newSurface+.9;
    if(player.velocity.y>0)player.velocity.y=0;
  }
  if(!diving&&!player.waterJumping&&player.swimPosition.y>newSurface-.08&&player.velocity.y<0){
    player.swimPosition.y=newSurface-.08;
    player.velocity.y=0;
  }

  const underwater=player.swimPosition.y<newSurface-.05;
  underwaterOverlay.style.display=underwater?"block":"none";
  if(underwater){
    scene.background.set(0x123d50);
    scene.fog.color.set(0x123d50);
    scene.fog.near=2;
    scene.fog.far=42;
  }else{
    scene.background.set(0x78929a);
    scene.fog.color.set(0x78929a);
    scene.fog.near=35;
    scene.fog.far=190;
  }
  camera.position.copy(player.swimPosition);
  camera.rotation.set(player.pitch,player.yaw,0,"YXZ");
}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;updateOcean(elapsed);updateDriftwood(elapsed,dt);updatePlayer(dt,elapsed);renderer.render(scene,camera);}
animate();
window.addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
